# Sanitized template. Copy to system.yaml on a deployment machine;
# relative paths resolve against this file (e.g. ./vllm -> ~/system/vllm).
version: 1
timezone: Asia/Shanghai

repositories:
  - key: vllm
    name: vLLM
    github: vllm-project/vllm
    path: ./vllm
    remote: upstream
    defaultBranch: main
    worktreeSlots: 3

  - key: vllm-ascend
    name: vLLM Ascend
    github: vllm-project/vllm-ascend
    path: ./vllm-ascend
    remote: upstream
    defaultBranch: main
    worktreeSlots: 3

knowledge:
  path: ./knowledge
  inbox: inbox
  historyLimit: 10
  checkpoint:
    autoCommit: true
    autoPush: true
    remote: origin
    branch: main

runtime:
  statePath: ./.loong
  worktreesPath: ./.worktrees
  serverHost: 127.0.0.1
  serverPort: 4174

agent:
  defaultProvider: deepseek-official
  defaultModel: deepseek-v4-flash
  defaultReasoningEffort: high
  idleProcessMinutes: 20
